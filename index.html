<html>
 <head>
 <title>Mi página web</title>
 <style>
   .quote-box {
     background-color: #f4f4f9;
     border-left: 5px solid #007bff;
     padding: 15px;
     margin: 15px 0;
     max-width: 500px;
   }
   .author {
     font-weight: bold;
     color: #555;
   }
 </style>
 </head>
 <body>
 <h1>Bienvenido a mi página web soy el profe</h1>
 <h1>Cita del Día</h1>

 <div class="quote-box">
   <p id="cita-texto">Cargando frase...</p>
   <p id="cita-autor" class="author"></p>
 </div>

 <br>
 <button onclick="obtenerCita()">Obtener otra cita</button>

 <script>
 function obtenerCita() {
   document.getElementById('cita-texto').textContent = 'Cargando frase...';
   document.getElementById('cita-autor').textContent = '';

   // Usamos un proxy CORS ligero para permitir que la petición fetch de JavaScript funcione desde S3
   fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://api.quotable.io/quotes/random'))
     .then(respuesta => {
       if (respuesta.ok) return respuesta.json();
       throw new Error('Error en la red');
     })
     .then(datos => {
       // AllOrigins devuelve el JSON original dentro de la propiedad 'contents'
       const contenido = JSON.parse(datos.contents);
       const cita = Array.isArray(contenido) ? contenido[0] : contenido;
       
       document.getElementById('cita-texto').textContent = `"${cita.content}"`;
       document.getElementById('cita-autor').textContent = `- ${cita.author}`;
     })
     .catch(error => {
       console.error('Error al obtener la cita:', error);
       document.getElementById('cita-texto').textContent = 'Ocurrió un error al cargar la frase.';
     });
 }

 // Ejecutamos la función una vez al cargar la página
 obtenerCita();
 </script>

 <footer>
 <p>Derechos reservados &copy; 2026</p>
 </footer>
 </body>
</html>
