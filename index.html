<html>
 <head>
 <title>Mi página web</title>
 <style>
   .quote-box {
     background-color: #f4f4f9;
     border-left: 5px solid #007bff;
     padding: 15px;
     margin: 15px 0;
     max-width: 500px;
   }
   .author {
     font-weight: bold;
     color: #555;
   }
 </style>
 </head>
 <body>
 <h1>Bienvenido a mi página web soy el profe</h1>
 <h1>Cita del Día</h1>

 <div class="quote-box">
   <p id="cita-texto">Cargando frase...</p>
   <p id="cita-autor" class="author"></p>
 </div>

 <br>
 <button onclick="obtenerCita()">Obtener otra cita</button>

 <script>
 function obtenerCita() {
   document.getElementById('cita-texto').textContent = 'Cargando frase...';
   document.getElementById('cita-autor').textContent = '';

   // Generamos un ID aleatorio entre 1 y 140 para traer una cita distinta
   const randomId = Math.floor(Math.random() * 140) + 1;

   // Petición usando HTTP directamente (sin HTTPS)
   fetch('http://dummyjson.com/quotes/' + randomId)
     .then(respuesta => {
       if (!respuesta.ok) {
         throw new Error(`Error HTTP: ${respuesta.status}`);
       }
       return respuesta.json();
     })
     .then(datos => {
       // DummyJSON devuelve un objeto simple: { quote: "...", author: "..." }
       document.getElementById('cita-texto').textContent = `"${datos.quote}"`;
       document.getElementById('cita-autor').textContent = `- ${datos.author}`;
     })
     .catch(error => {
       console.error('Error al obtener la cita:', error);
       document.getElementById('cita-texto').textContent = 'Ocurrió un error al cargar la frase.';
     });
 }

 // Ejecutamos la función una vez al cargar la página
 obtenerCita();
 </script>

 <footer>
 <p>Derechos reservados &copy; 2026</p>
 </footer>
 </body>
</html>
